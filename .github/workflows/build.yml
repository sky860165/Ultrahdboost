
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract source zip
        run: |
          ZIPFILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          echo "Found zip: $ZIPFILE"
          unzip -q "$ZIPFILE" -d extracted_source

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Find project root
        id: findroot
        run: |
          DIR=$(dirname "$(find extracted_source -maxdepth 5 -name settings.gradle | head -n 1)")
          echo "Found project root: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        working-directory: ${{ steps.findroot.outputs.dir }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.findroot.outputs.dir }}/app/build/outputs/apk/debug/*.apk
